name: Bug report
description: Report a reproducible product or engineering problem.
title: 'fix: '
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and tenant scope
      description: Include affected organization/provider without sharing secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Sanitized logs or screenshots only. Never include credentials, prompts or responses.
